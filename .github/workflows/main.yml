name: Cloudflare SpeedTest Auto

on:
  schedule:
    # 每天北京时间凌晨 04:00 自动运行一次 (UTC 20:00)
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  speedtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and Run CloudflareSpeedTest
        run: |
          # 1. 下载官方正版编译包
          wget -q -O cfst.tar.gz https://github.com/XIU2/CloudflareSpeedTest/releases/latest/download/cfst_linux_amd64.tar.gz
          tar -zxf cfst.tar.gz
          chmod +x cfst
          
          # 2. 真实测速挑选前 10 个最快 IP
          ./cfst -tp 443 -url https://speed.cloudflare.com/__down?bytes=10000000 -dn 10 -tl 300 -o result.csv
          
          # 3. 转换为订阅格式
          echo "# Private Auto BestCF IPs" > ips.txt
          awk -F',' 'NR>1 {print $1 ":443#" $1 "-" $6 "MB/s"}' result.csv >> ips.txt

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ips.txt
          git commit -m "Auto update best IP" || echo "No changes"
          git push
