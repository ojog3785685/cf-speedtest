name: Cloudflare SpeedTest Auto

on:
  schedule:
    # 每天北京时间凌晨 04:00 自动运行一次 (UTC 20:00)
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  speedtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and Run SpeedTest
        run: |
          # 1. 使用 curl 强制追踪真实下载地址并解压
          curl -sL "https://github.com/XIU2/CloudflareSpeedTest/releases/latest/download/cfst_linux_amd64.tar.gz" -o cfst.tar.gz
          tar -zxf cfst.tar.gz
          
          # 2. 自动定位解压出来的测速程序并赋予权限
          BIN=$(find . -maxdepth 1 -type f \( -name "cfst" -o -name "CloudflareST" \) | head -n 1)
          chmod +x "$BIN"
          
          # 3. 运行测速筛选出前 10 个最快 IP
          "$BIN" -tp 443 -url https://speed.cloudflare.com/__down?bytes=10000000 -dn 10 -tl 300 -o result.csv
          
          # 4. 生成订阅文件
          echo "# Private Auto BestCF IPs" > ips.txt
          awk -F',' 'NR>1 {print $1 ":443#" $1 "-" $6 "MB/s"}' result.csv >> ips.txt

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ips.txt
          git commit -m "Auto update best IP" || echo "No changes"
          git push
