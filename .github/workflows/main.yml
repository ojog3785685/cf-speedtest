name: Cloudflare SpeedTest Auto

on:
  schedule:
    # 每天北京时间凌晨 04:00 自动运行一次测速 (UTC 20:00)
    - cron: '0 20 * * *'
  workflow_dispatch: # 支持随时手动点击立即运行

permissions:
  contents: write

jobs:
  speedtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CloudflareSpeedTest
        run: |
          wget -N https://github.com/XIU2/CloudflareSpeedTest/releases/download/v2.2.5/cfst_linux_amd64.tar.gz
          tar -zxf cfst_linux_amd64.tar.gz
          chmod +x cfst

      - name: Run Speed Test
        run: |
          # 自动测试并筛选出延迟低、速度最快的 10 个优质 IP
          ./cfst -tp 443 -url https://speed.cloudflare.com/__down?bytes=50000000 -dn 10 -tl 250 -o result.csv
          
          # 格式化为订阅可用格式
          echo "# Private Auto BestCF IPs" > ips.txt
          awk -F',' 'NR>1 {print $1 ":443#" $1 "-" $6 "MB/s"}' result.csv >> ips.txt

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add ips.txt
          git commit -m "Auto update best IP" || exit 0
          git push
